name: Android release build

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.x
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: yarn
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android release APK
        run: eas build --platform android --profile preview --non-interactive --wait --json > eas-build.json

      - name: Download APK from EAS
        id: apk
        run: |
          apk_url="$(jq -er 'if type == "array" then .[0] else . end | .artifacts.buildUrl // .artifacts.applicationArchiveUrl' eas-build.json)"
          apk_name="LangEx-android-${GITHUB_REF_NAME}.apk"
          curl --fail --location "$apk_url" --output "$apk_name"
          echo "name=$apk_name" >> "$GITHUB_OUTPUT"

      - name: Attach APK to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: LangEx-android-${{ github.ref_name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.apk.outputs.name }}#Installable Android APK" \
            --verify-tag \
            --title "LangEx $GITHUB_REF_NAME" \
            --generate-notes \
            --prerelease
